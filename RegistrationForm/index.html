
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Student Admission Portal</h1>
            <p>Register for your preferred course</p>
        </header>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="name">Student Name *</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number *</label>
                <input type="text" id="roll" name="roll"
                       placeholder="Enter roll number">
                <small class="error" id="rollError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email"
                       placeholder="example@gmail.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="course">Select Course *</label>
                <select id="course" name="course">
                    <option value="">-- Select Course --</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="ECE">Electronics and Communication</option>
                    <option value="EEE">Electrical and Electronics</option>
                    <option value="MECH">Mechanical Engineering</option>
                </select>
                <small class="error" id="courseError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a strong password">
                <small class="hint">
                    Minimum 8 characters, uppercase, lowercase,
                    number and special character.
                </small>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Re-enter password">
                <small class="error" id="confirmPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="document">File Upload (Marksheet) *</label>
                <input type="file" id="document" name="document"
                       accept=".jpg,.jpeg,.png,.pdf">
                <small class="hint">Allowed: JPG, PNG or PDF. Maximum 2 MB.</small>
                <small class="error" id="documentError"></small>
            </div>

            <button type="submit">Register Student</button>

            <p id="successMessage" role="status"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
